name: release

# Tagged builds only, and only meaningful in the repository that owns a signing
# key. A fork without the secrets still gets a green job and an unsigned APK —
# see the last step.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PROPS" ]; then
            echo "no signing secrets — the APK will be unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf '%s\n' "$KEYSTORE_PROPS" > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble release
        run: ./gradlew assembleRelease --no-daemon -PrequireSigning=${{ steps.key.outputs.signed }}

      - name: Name the artifact
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEST="hermes-${GITHUB_REF_NAME#v}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "$DEST" | tee "$DEST.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          draft: true
          generate_release_notes: true
